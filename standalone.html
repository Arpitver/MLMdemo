 [['NP1002','Demo Bank','000000000001','DEMO0000001'],['NP1003','Demo Bank','000000000002','DEMO0000002'],['NP1005','Demo Bank','000000000003','DEMO0000003']].forEach(b=>{const m=G(b[0]);if(m&&!m.bk&&!m.bkd){m.bkd=1;m.bk={name:m.name,bank:b[1],acc:b[2],ifsc:b[3],upi:''}}})}
function mat(){const now=Date.now();(S.inv||[]).forEach(v=>{if(v.st==='Active'&&now-v.t>=v.d*864e5){v.st='Matured';const m=G(v.mid),p=v.amt*v.r/100;m.bal+=v.amt+p;S.tx.push({t:now,id:v.mid,type:'invest',amt:v.amt+p,desc:'Investment matured: principal '+R(v.amt)+' + return '+R(p)});aud(v.mid,'Investment matured '+R(v.amt+p));save()}})}
function doInv(i){const m=G(U.id),a=+$('#ia').value,p=INV[i];if(!(a>=1000))return toast('Minimum investment is ₹1,000');if(a>m.bal)return toast('Insufficient wallet balance. Add funds first.');m.bal-=a;(S.inv=S.inv||[]).push({id:Date.now(),mid:m.id,plan:p.n,amt:a,t:Date.now(),d:p.d,r:p.r,st:'Active'});aud(m.id,'Invested '+R(a)+' in '+p.n);save();toast(R(a)+' invested in '+p.n+' plan');boom();draw()}
function dep(){const a=+$('#da').value,m=G(U.id);if(!(a>=500&&a<=100000))return toast('Enter an amount from ₹500 to ₹1,00,000');m.bal+=a;S.tx.push({t:Date.now(),id:m.id,type:'deposit',amt:a,desc:'Wallet top-up via UPI (demo)'});aud(m.id,'Wallet top-up '+R(a));save();toast(R(a)+' added to wallet');draw()}
function ff(){(S.inv||[]).forEach(v=>{if(v.st==='Active')v.t-=10*864e5});mat();save();toast('Demo: time moved forward by 10 days');draw()}
async function saveBk(){const m=G(U.id),g=i=>$('#'+i).value.trim(),a=g('ba'),i=g('bi').toUpperCase();
 if(g('bn').length<3||g('bb').length<2)return toast('Enter holder name and bank name');if(!/^\d{9,18}$/.test(a))return toast('Account number must be 9-18 digits');if(a!==g('bc'))return toast('Account numbers do not match');if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(i))return toast('Invalid IFSC code');
 const pp=$('#bp').value,h=await H(pp);if(m.pw!==h&&m.pw!==pp)return toast('Wrong login password');
 m.bk={name:g('bn'),bank:g('bb'),acc:a,ifsc:i,upi:g('bu')};aud(m.id,'Bank account saved');save();toast('Demo bank details saved to this browser');boom();draw()}
V.bank=()=>{if(can())return `<div class="c"><div class="ov"><table><tr><th>ID</th><th>Holder</th><th>Bank</th><th>Account</th><th>IFSC</th><th>UPI</th></tr>${S.m.filter(m=>m.bk).map(m=>`<tr><td>${m.id}</td><td>${E(m.bk.name)}</td><td>${E(m.bk.bank)}</td><td>····${m.bk.acc.slice(-4)}</td><td>${m.bk.ifsc}</td><td>${E(m.bk.upi||'-')}</td></tr>`).join('')||'<tr><td colspan=6>No bank accounts added yet</td></tr>'}</table></div></div>`;
 const m=G(U.id),b=m.bk;return (b?`<div class="bc"><small>${E(b.bank)}</small><div class="cn">···· ···· ${b.acc.slice(-4)}</div><div class="bf"><span>${E(b.name)}</span><span>${b.ifsc}</span></div></div>`:'<div class="c k">No bank account linked yet. Add one below to enable withdrawals.</div>')+`<div class="c"><b>${b?'Update':'Add'} bank account</b><div class="fm"><div><label>Account holder name</label><input id="bn" value="${b?E(b.name):''}"></div><div><label>Bank name</label><input id="bb" value="${b?E(b.bank):''}"></div><div><label>Account number</label><input id="ba" inputmode="numeric" placeholder="9-18 digits"></div><div><label>Confirm account number</label><input id="bc" inputmode="numeric"></div><div><label>IFSC code</label><input id="bi" placeholder="DEMO0000001" value="${b?b.ifsc:''}"></div><div><label>UPI ID (optional)</label><input id="bu" value="${b&&b.upi?E(b.upi):''}"></div><div><label>Login password (to confirm)</label><input id="bp" type="password"></div></div><br><button class="btn" onclick="saveBk()">Save bank account</button></div>`};
V.inv=()=>{const L=(S.inv||[]).filter(v=>can()||v.mid===U.id).slice().reverse(),m=!can()&&G(U.id),now=Date.now(),tt=f=>L.filter(f).reduce((s,v)=>s+v.amt,0),ex=L.filter(v=>v.st==='Active').reduce((s,v)=>s+v.amt*v.r/100,0);
 return `<div style="text-align:right;margin-bottom:10px"><button class="btn gh s" onclick="ff()">⏩ Demo: move time +10 days</button></div><div class="g st"><div class="c"><div class="k">${can()?'Total invested':'Wallet balance'}</div><div class="v">${R(can()?tt(()=>1):m.bal)}</div></div><div class="c"><div class="k">Active investments</div><div class="v">${R(tt(v=>v.st==='Active'))}</div></div><div class="c"><div class="k">Illustrative demo credits</div><div class="v">${R(ex)}</div></div><div class="c"><div class="k">Matured</div><div class="v">${R(tt(v=>v.st==='Matured'))}</div></div></div>`+
 (can()?'':`<div class="c"><b>📈 Invest from your wallet</b><div class="fm"><div><label>Amount (min ₹1,000)</label><input id="ia" type="number" value="5000"></div></div><div class="pg">${INV.map((p,i)=>`<div class="pc"><div class="ic">${p.e}</div><h3>${p.n} Plan</h3><div class="pr">${p.r}%</div><ul><li>${p.d} days lock-in</li><li>Illustrative ${p.r}% demo credit at maturity</li><li>Auto-credited to wallet</li></ul><button class="btn s" onclick="doInv(${i})">Invest now</button></div>`).join('')}</div></div><div class="c"><b>➕ Add funds to wallet (demo UPI)</b><div class="fm"><div><label>Amount</label><input id="da" type="number" value="5000"></div></div><br><button class="btn ok" onclick="dep()">Add money</button></div>`)+
 `<div class="c"><b>My investments</b><div class="ov"><table><tr><th>Date</th>${can()?'<th>Member</th>':''}<th>Plan</th><th>Amount</th><th>Return</th><th>Matures</th><th>Progress</th><th>Status</th></tr>${L.map(v=>{const p=Math.min(100,(now-v.t)/(v.d*864e5)*100);return `<tr><td>${D(v.t)}</td>${can()?`<td>${v.mid}</td>`:''}<td>${v.plan}</td><td>${R(v.amt)}</td><td>${v.r}% (${R(v.amt*v.r/100)})</td><td>${D(v.t+v.d*864e5)}</td><td style="min-width:110px"><div class="sm"><i style="width:${p}%;background:var(--p2)"></i></div></td><td><span class="b ${v.st==='Matured'?'ok':'wa'}">${v.st}</span></td></tr>`}).join('')||'<tr><td colspan=8>No investments yet</td></tr>'}</table></div></div>`};
function rows(q){q=q.toLowerCase();return S.m.filter(m=>(m.id+m.name+m.mob).toLowerCase().includes(q)).map(m=>`<tr><td>${m.id}</td><td>${E(m.name)}</td><td>${m.mob}</td><td>${m.sp||'-'}</td><td>${m.pos?m.pos.toUpperCase():'-'}</td><td>${PK[m.pk].n}</td><td>${m.L}/${m.R}</td><td>${rank(m)}</td><td>${R(m.bal)}</td><td><button class="btn gh s" onclick="U.root='${m.id}';go('tree')">Tree</button> <button class="btn s ${m.off?'ok':'er'}" onclick="blk('${m.id}')">${m.off?'Unblock':'Block'}</button></td></tr>`).join('')}
function fl(){$('#tb').innerHTML=rows($('#q').value)}
function node(id,d){const m=G(id);return `<div class="tn"><div class="nd" onclick="U.root='${id}';draw()"><i class="av">${E(m.name[0])}</i><b>${E(m.name.split(' ')[0])}</b><small>${id} · ${PK[m.pk].n}</small><small>L${m.L} · R${m.R}</small></div>${d>0?`<div class="kids">${['l','r'].map(p=>m[p]?node(m[p],d-1):`<div class="tn"><div class="nd e" onclick="go('add',{sp:'${id}',ps:'${p}'})"><b>+</b><small>${p==='l'?'Left':'Right'} empty</small></div></div>`).join('')}</div>`:''}</div>`}
function doAdd(){const n=$('#n').value.trim(),mo=$('#mo').value.trim(),sp=$('#sp').value.trim().toUpperCase();
 if(n.length<3)return toast('Enter a valid name');if(!/^\d{10}$/.test(mo))return toast('Enter a 10-digit mobile number');if(!G(sp)||G(sp).off)return toast('Sponsor ID not found or blocked');
 if(!can()&&sp!==U.id&&!down(U.id).some(x=>x.id===sp))return toast('Sponsor must be in your network');
 const m=join(n,mo,sp,$('#ps').value,+$('#pk').value);aud(U.id,'Member registered '+m.id);save();U.pre=null;toast('Member '+m.id+' created · password 1234');boom();go(can()?'mem':'tree')}
function reqW(){const a=+$('#wa').value,m=G(U.id);if(!(a>=500))return toast('Minimum withdrawal is ₹500');if(!m.bk)return toast('Add your bank account first');if(a>m.bal)return toast('Insufficient wallet balance');
 m.bal-=a;S.w.push({id:Date.now(),mid:m.id,amt:a,st:'Pending',t:Date.now(),bk:m.bk});aud(m.id,'Requested demo withdrawal '+R(a));save();toast('Withdrawal requested');draw()}
function dw(id,ok){const w=S.w.find(x=>x.id===id);w.st=ok?'Approved':'Rejected';if(ok)w.utr='UTR'+Math.floor(1e11+Math.random()*9e11);aud('admin','Withdrawal '+w.st+' – '+w.mid+' '+R(w.amt));if(!ok)G(w.mid).bal+=w.amt;save();toast(ok?'Approved – pay '+R(w.amt*.95):'Rejected – amount refunded');draw()}
draw();

</script>
</body>
